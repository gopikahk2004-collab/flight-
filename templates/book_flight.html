{% extends 'base.html' %}


{% block content %}


<h2>Book Flight</h2>


<!-- Display booking error -->
{% if error %}

    <p style="color:red;">
        {{ error }}
    </p>

{% endif %}


<form method="POST">

    {% csrf_token %}


    <!-- Display booking form -->
    {{ form.as_p }}


    <button type="submit">
        Book Flight
    </button>


</form>


{% endblock %}
